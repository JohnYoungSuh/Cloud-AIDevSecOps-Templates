# Starship prompt for IaC workflows
format = """
[┌─](bold green)$directory$git_branch$git_status$terraform$ansible
[└─](bold green)$character"""

[directory]
truncation_length = 3
truncate_to_repo = true
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold cyan"

[git_branch]
format = "on [$symbol$branch(:$remote_branch)]($style) "
symbol = " "
style = "bold purple"
# Highlight project/* branches
truncation_length = 40
truncation_symbol = "…"

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bold red"
conflicted = "⚔️"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "📦"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[terraform]
format = "via [$symbol$workspace]($style) "
symbol = "💠 "
detect_extensions = ["tf", "tfplan", "tfstate"]
detect_files = ["terraform.tfvars"]
detect_folders = ["terraform", ".terraform"]

[ansible]
format = "via [$symbol$version]($style) "
symbol = "🅰️ "
detect_extensions = ["yml", "yaml"]
detect_files = ["ansible.cfg", "playbook.yml"]
detect_folders = ["ansible", "playbooks"]

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[✗](bold red)"

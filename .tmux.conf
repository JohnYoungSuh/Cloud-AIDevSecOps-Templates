# Tmux config for IaC project workflows
set -g default-terminal "screen-256color"
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1

# Prefix key: Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Split panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Mouse support
set -g mouse on

# Status bar - show current project branch
set -g status-interval 5
set -g status-style bg=black,fg=white
set -g status-left-length 50
set -g status-left "#[fg=green,bold]#S #[fg=yellow]#(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD 2>/dev/null | sed 's/project\//📁 /')"
set -g status-right "#[fg=cyan]%Y-%m-%d %H:%M"

# Window status
setw -g window-status-current-style fg=black,bg=green,bold
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "

# Pane borders
set -g pane-border-style fg=colour240
set -g pane-active-border-style fg=green

# Message style
set -g message-style bg=black,fg=green,bold
